name: publish

# Publishes a released version to GitHub Packages. release-please.yml calls it after a release; it can
# also be started by hand for an existing tag, for example when a publish failed after the tag was made.

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag or commit to publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@onelitefeathernet'

      - run: pnpm install --frozen-lockfile

      # nuxt-module-build reads .nuxt/tsconfig.json, which `nuxt-module-build prepare` writes.
      - run: pnpm dev:prepare

      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
