name: release-please

# One release for the whole package. release-please keeps the release pull request up to date on main;
# when it is merged, the release is created and tagged. The publish job (publish.yml) then publishes the released
# commit to GitHub Packages. Tags created with GITHUB_TOKEN start no workflow, so nothing listens for a
# tag push.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.9.1

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
